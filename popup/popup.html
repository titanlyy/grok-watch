<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grok Watch</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="grid" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="shell">
    <header>
      <div class="orb" id="orb" aria-hidden="true">
        <span class="orb-halo"></span>
        <span class="orb-ring"></span>
        <span class="orbit a"><i></i></span>
        <span class="orbit b"><i></i></span>
        <span class="orbit c"><i></i></span>
        <span class="orb-core"></span>
      </div>
      <div class="brand">
        <div class="kicker"><span class="live-dot"></span><span id="kickerText">UPLINK STANDBY</span></div>
        <div class="brand-title">GROK WATCH</div>
        <div class="brand-sub" id="fetchedAt">acquiring signal…</div>
      </div>
      <button class="refresh-btn" id="refreshBtn" title="Refresh now" type="button">
        <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M4 4.5A7 7 0 0 1 17 10M16 15.5A7 7 0 0 1 3 10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M17 6.5V10h-3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M3 13.5V10h3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </header>

    <div class="eq" id="eq" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="error-banner" id="errorBanner" hidden>
      <span id="errorText">Could not read Grok usage.</span>
      <button class="linkish" id="openGrok" type="button" hidden>Open grok.com</button>
    </div>
    <div class="stale-note" id="staleNote" hidden>Link dropped — holding the last snapshot.</div>

    <section id="hero"></section>
    <section id="spectrumWrap" hidden>
      <div class="divider">pool composition</div>
      <div class="spectrum" id="spectrum"></div>
      <div class="legend" id="legend"></div>
      <div class="rows" id="productRows"></div>
    </section>
    <section id="windowsWrap" hidden>
      <div class="divider">query windows</div>
      <div class="rows" id="windows"></div>
    </section>
    <section id="resetsWrap" hidden>
      <div class="divider">banked resets</div>
      <div class="rows" id="resets"></div>
    </section>

    <label class="toggle-row">
      <span class="toggle-copy">
        <strong>Floating panel</strong>
        <span>On grok.com · drag, resize, collapse</span>
      </span>
      <span class="switch">
        <input type="checkbox" id="panelToggle" />
        <i></i>
      </span>
    </label>

    <footer>grok.com session · local only · no reset is spent from here</footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
