<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grok Watch</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="12" cy="12" r="9.25" stroke="url(#ring)" stroke-width="1.6"/>
          <path d="M12 12 L12 6.5" stroke="url(#hand)" stroke-width="1.7" stroke-linecap="round"/>
          <path d="M12 12 L16.2 14.2" stroke="url(#hand2)" stroke-width="1.7" stroke-linecap="round"/>
          <circle cx="12" cy="12" r="1.35" fill="#7dd3fc"/>
          <defs>
            <linearGradient id="ring" x1="3" y1="3" x2="21" y2="21" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#38bdf8"/>
              <stop offset="100%" stop-color="#818cf8"/>
            </linearGradient>
            <linearGradient id="hand" x1="12" y1="6" x2="12" y2="12" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#38bdf8"/>
              <stop offset="100%" stop-color="#4ade80"/>
            </linearGradient>
            <linearGradient id="hand2" x1="12" y1="12" x2="16" y2="14" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#818cf8"/>
              <stop offset="100%" stop-color="#38bdf8"/>
            </linearGradient>
          </defs>
        </svg>
        <div>
          <div class="brand-title">Grok Watch</div>
          <div class="brand-sub" id="fetchedAt">Loading…</div>
        </div>
      </div>
      <button class="refresh-btn" id="refreshBtn" title="Refresh now" type="button">
        <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M4 4.5A7 7 0 0 1 17 10M16 15.5A7 7 0 0 1 3 10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M17 6.5V10h-3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M3 13.5V10h3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </header>

    <div class="error-banner" id="errorBanner" hidden>
      <span id="errorText">Could not read Grok usage.</span>
      <button class="linkish" id="openGrok" type="button" hidden>Open grok.com</button>
    </div>

    <div class="stale-note" id="staleNote" hidden>Couldn’t refresh — showing the last snapshot.</div>

    <section class="core-grid" id="coreGrid"></section>

    <div class="divider-label" id="divider" hidden>Product breakdown</div>
    <section class="sources-section" id="sourcesSection"></section>

    <footer>
      Session on <code>grok.com</code> · stays in this browser
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
